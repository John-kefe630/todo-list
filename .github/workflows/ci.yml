name: Continuous Integration

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  ci-pipeline:
    name: Test & Validate Docker Container
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository source code
        uses: actions/checkout@v4

      - name: Setup Node.js runtime environment
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies cleanly
        run: npm ci

      - name: Execute automated API test suite
        run: npm test

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker Image
        run: |
          docker build -t todo-app:ci .

      - name: Run Docker Container
        run: |
          docker run -d -p 3000:3000 --name ci-todo-container todo-app:ci
          # Give the container 2 seconds to initialize
          sleep 2

      - name: Verify Container Health Endpoint
        run: |
          echo "Testing /health endpoint on container..."
          HTTP_RESPONSE=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:3000/health)
          if [ "$HTTP_RESPONSE" -eq 200 ]; then
            echo "✅ Container Health Check Passed (HTTP 200)"
          else
            echo "❌ Container Health Check Failed (HTTP $HTTP_RESPONSE)"
            docker logs ci-todo-container
            exit 1
          fi

      - name: Clean up test container
        if: always()
        run: |
          docker stop ci-todo-container || true
          docker rm ci-todo-container || true